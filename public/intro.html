<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucas Pinto — Portfolio</title>
    <meta
      name="description"
      content="Menú principal 3D en forma de gráfico de torta: About Me y proyectos personales de Lucas Pinto."
    />
    <style>
      :root {
        --font-heading: "HelveticaNowDisplay-Medium", "Helvetica Neue", Arial, sans-serif;
        --chrome-red: #ea4335;
        --chrome-yellow: #fbbc05;
        --chrome-green: #34a853;
        --chrome-blue: #4285f4;
        --focus: #facc15;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: var(--font-heading);
        color: #fff;
        background-color: #030a14; /* fallback while / while the image loads */
        /* Same artwork as mainPage-bg.jpg with the baked board text removed,
           so the interactive overlays can draw their own labels. */
        background-image: url("/mainPage-bg-menu.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* ---------- Navbar (same as about.html) ---------- */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
      }
      .site-nav .logo {
        font-size: clamp(21px, 4vw, 26px);
        letter-spacing: -0.02em;
        user-select: none;
      }
      /* Holographic chips: dark, near-opaque glass (the page background is a
         bright illustration, so translucent blue would blend into it) with a
         bright cyan rim and a glowing white text. */
      .site-nav .logo {
        color: #fff;
        text-decoration: none;
        padding: 0.26em 0.66em 0.3em;
        border: 2.5px solid rgba(120, 240, 255, 1);
        border-radius: 12px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 30%, rgba(255, 255, 255, 0) 50%),
          linear-gradient(180deg, rgba(0, 96, 170, 0.92) 0%, rgba(2, 26, 74, 0.96) 55%, rgba(1, 8, 28, 0.98) 100%);
        box-shadow:
          0 0 0 1.5px rgba(2, 14, 40, 0.75),
          0 0 16px rgba(80, 215, 255, 0.85),
          0 0 42px rgba(0, 150, 255, 0.45),
          inset 0 0 18px rgba(80, 215, 255, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        text-shadow:
          0 0 10px rgba(160, 245, 255, 1),
          0 0 4px rgba(255, 255, 255, 0.9),
          0 1px 4px rgba(0, 0, 0, 0.95);
        transition: filter 0.15s ease, box-shadow 0.15s ease;
      }
      .site-nav .logo:hover {
        filter: brightness(1.25);
        box-shadow:
          0 0 0 1.5px rgba(2, 14, 40, 0.75),
          0 0 22px rgba(120, 240, 255, 1),
          0 0 52px rgba(0, 170, 255, 0.6),
          inset 0 0 22px rgba(120, 240, 255, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.45);
      }
      .site-nav a:focus-visible,
      .site-nav button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
        border-radius: 12px;
      }

      /* ---------- Navbar right cluster: ES/EN switch ---------- */
      .site-nav .menu {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .lang-switch {
        display: flex;
        gap: 0.3rem;
        padding: 0.25rem;
        border: 1px solid rgba(120, 240, 255, 0.4);
        border-radius: 10px;
        background: rgba(1, 10, 30, 0.65);
      }
      .lang-switch button {
        flex: 1;
        padding: 0.35rem 0;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: #cfefff;
        font: inherit;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .lang-switch button[aria-pressed="true"] {
        color: #fff;
        background: linear-gradient(180deg, rgba(0, 190, 255, 0.6), rgba(0, 90, 190, 0.7));
        box-shadow: inset 0 0 10px rgba(120, 240, 255, 0.55);
      }
      .lang-switch button:hover {
        color: #fff;
      }

      /* ---------- Stage ---------- */
      /* The stage mirrors the background "cover" geometry exactly (same
         aspect ratio, same centering). Everything positioned in % of this
         frame scales and moves together with the background image, so the
         chart never drifts when the viewport changes size. */
      .stage {
        position: fixed;
        left: 50%;
        top: 50%;
        width: max(100vw, calc(100dvh * 1672 / 941));
        aspect-ratio: 1672 / 941;
        transform: translate(-50%, -50%);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .chart-wrap {
        position: absolute;
        /* Centered on the circular platform painted in the background:
           x 50.8%, y 55.3% of the image; 34.5% of its width. */
        left: 50%;
        top: 52.5%;
        width: 34.5%;
        aspect-ratio: 1 / 1;
        transform: translate(-50%, -50%);
        /* Children can size in cqw so text scales with the chart itself */
        container-type: size;
      }
      .chart-wrap canvas {
        /* The canvas is larger than the wrap: the hovered segment pops out
           (scale + z-stretch) and would otherwise be clipped by
           the canvas edge. The pie keeps its visual size and center. */
        position: absolute;
        left: -18%;
        top: -18%;
        width: 136%;
        height: 136%;
        display: block;
        touch-action: manipulation;
      }
      .chart-wrap canvas:focus-visible {
        outline: none;
      }

      /* ---------- Board menu: interactive screen over the painted
         "QA METRICS" panel on the desk. The overlay is an SVG whose
         viewBox is the background image (1672x941), so it registers
         exactly with the scene at every viewport size. ---------- */
      .board-menu {
        position: absolute;
        inset: 0;
        z-index: 3;
        /* Only the links take the pointer; the rest of the stage must
           stay interactive for the 3D pie behind it. */
        pointer-events: none;
      }
      .board-menu a {
        pointer-events: auto;
        cursor: pointer;
        outline: none;
      }
      .board-menu .row-bg {
        fill: transparent;
        stroke: transparent;
        transition: fill 0.15s ease, stroke 0.15s ease;
      }
      .board-menu a:hover .row-bg {
        fill: rgba(120, 240, 255, 0.18);
        stroke: rgba(140, 245, 255, 0.55);
      }
      .board-menu a:focus-visible .row-bg {
        fill: rgba(120, 240, 255, 0.2);
        stroke: #facc15;
      }
      .board-menu .row-label {
        fill: #eaf9ff;
        font-family: var(--font-heading);
        font-size: 20px;
        letter-spacing: 0.01em;
      }
      .board-menu a:hover .row-label,
      .board-menu a:focus-visible .row-label {
        fill: #ffffff;
      }
      .board-menu .row-chev {
        opacity: 0.4;
        transition: opacity 0.15s ease;
      }
      .board-menu a:hover .row-chev,
      .board-menu a:focus-visible .row-chev {
        opacity: 1;
      }
      .board-menu .panel-title {
        font-family: var(--font-heading);
        font-size: 24px;
        letter-spacing: 0.02em;
      }

      /* Whole-board link (Logros): transparent panel, hover lights the
         painted neon frame and brightens the label. */
      .board-menu .board-hit {
        fill: transparent;
      }
      .board-menu .board-link-bg {
        fill: transparent;
        transition: fill 0.15s ease, filter 0.15s ease;
      }
      .board-menu a:hover .board-link-bg,
      .board-menu a:focus-visible .board-link-bg {
        fill: rgba(126, 240, 255, 0.22);
        filter: drop-shadow(0 0 9px rgba(126, 240, 255, 0.9));
      }
      .board-menu .board-link-title {
        fill: #eaf9ff;
        font-family: var(--font-heading);
        font-size: 34px;
        letter-spacing: 0.06em;
        transition: fill 0.15s ease, filter 0.15s ease;
      }
      .board-menu a:hover .board-link-title,
      .board-menu a:focus-visible .board-link-title {
        fill: #ffffff;
        filter: drop-shadow(0 0 6px rgba(160, 245, 255, 0.9));
      }
      .board-menu .board-link-rule {
        stroke: rgba(126, 240, 255, 0.5);
        stroke-width: 1.6;
        transition: stroke 0.15s ease;
      }
      .board-menu a:hover .board-link-rule,
      .board-menu a:focus-visible .board-link-rule {
        stroke: #7ef0ff;
      }
      .board-menu .board-link-chev {
        fill: none;
        stroke: #eaf9ff;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.45;
        transition: opacity 0.15s ease;
      }
      .board-menu a:hover .board-link-chev,
      .board-menu a:focus-visible .board-link-chev {
        opacity: 1;
      }

      /* Side arrows: holographic HUD buttons (same glass recipe as the
         labels) so they contrast against the illustrated background. */
      .chart-arrow {
        position: absolute;
        top: 50%;
        display: grid;
        place-items: center;
        /* Sizes in % of the chart frame so the buttons scale with the scene */
        width: 8.15%;
        aspect-ratio: 1 / 1;
        padding: 0;
        cursor: pointer;
        transform: translateY(-50%);
        z-index: 5;
        border: 2px solid rgba(126, 232, 255, 0.95);
        border-radius: 12px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 32%, rgba(255, 255, 255, 0) 52%),
          linear-gradient(180deg, rgba(0, 170, 255, 0.32) 0%, rgba(0, 70, 175, 0.55) 55%, rgba(1, 22, 74, 0.85) 100%);
        box-shadow:
          0 0 10px rgba(80, 215, 255, 0.6),
          0 0 24px rgba(0, 150, 255, 0.3),
          inset 0 0 14px rgba(80, 215, 255, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        transition: filter 0.15s ease, box-shadow 0.15s ease;
      }
      .chart-arrow:hover,
      .chart-arrow:focus-visible {
        filter: brightness(1.25);
        box-shadow:
          0 0 14px rgba(120, 230, 255, 0.9),
          0 0 32px rgba(0, 170, 255, 0.5),
          inset 0 0 18px rgba(120, 230, 255, 0.45),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      .chart-arrow svg {
        display: block;
        width: 45%;
        height: auto;
        filter: drop-shadow(0 0 5px rgba(150, 240, 255, 0.95));
      }
      .chart-arrow--left {
        left: -11.4%;
      }
      .chart-arrow--right {
        right: -11.4%;
      }
      .chart-arrow:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
        border-radius: 12px;
      }


      /* Hover/selection label above the chart */
      #chart-label {
        /* Sits just above the pie with a clear gap: absolute inside
           .chart-wrap, so the gap scales with the chart size
           (pie top ~= 37% of the wrap height). */
        position: absolute;
        left: 0;
        right: 0;
        top: 21%;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0 6px;
        margin: 0;
        pointer-events: none;
        color: #fff; /* the JS overrides this with the section's neon color */
        opacity: 0;
        transition: opacity 0.2s ease;
        user-select: none;
      }
      #chart-label.is-visible {
        opacity: 1;
      }

      /* Holographic HUD panel: same futuristic-cartoon language as the
         intro background (glowing cyan rim, glowing blue glass, glossy sheen).
         The dark glass guarantees contrast for the neon section color. */
      #chart-label-text {
        position: relative;
        display: inline-block;
        max-width: 100%;
        padding: 0.38em 1em 0.44em;
        font-size: clamp(0.85rem, 4.7cqw, 1.7rem);
        line-height: 1.25;
        text-align: center;
        letter-spacing: 0.02em;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 30%, rgba(255, 255, 255, 0) 50%),
          linear-gradient(180deg, rgba(0, 170, 255, 0.30) 0%, rgba(0, 70, 175, 0.55) 55%, rgba(1, 22, 74, 0.84) 100%);
        border: 2px solid rgba(126, 232, 255, 0.95);
        border-radius: 14px;
        box-shadow:
          0 0 12px rgba(80, 215, 255, 0.65),
          0 0 30px rgba(0, 150, 255, 0.35),
          inset 0 0 18px rgba(80, 215, 255, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        text-shadow:
          0 0 8px currentColor,
          0 0 2px rgba(255, 255, 255, 0.65),
          0 1px 3px rgba(0, 0, 0, 0.8);
        white-space: normal;
        overflow-wrap: anywhere;
      }

      /* ---------- Fallback (no WebGL) ---------- */
      #fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        text-align: center;
      }
      .no-webgl #fallback {
        display: flex;
      }
      .no-webgl canvas {
        display: none;
      }
      #fallback a {
        color: #fff;
        text-decoration: none;
        font-size: clamp(1.2rem, 4vw, 1.8rem);
        padding: 0.5em 1.2em;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
      }
      #fallback a:hover {
        border-color: #fff;
      }
      #fallback a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar (same as about.html) -->
    <nav class="site-nav">
      <a class="logo" href="/about.html">Lucas Pinto</a>

      <div class="menu">
        <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-aria="language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>

    <main class="stage">
      <h1 class="sr-only">Lucas Pinto — Portfolio</h1>

      <div id="chart-wrap" class="chart-wrap">

        <!-- Visible fallback when WebGL is unavailable -->
        <div id="fallback">

            <circle cx="30" cy="120" r="8.5" fill="#ffd22b" />
            <text class="row-label" x="47" y="128">QA Checklist</text>
            <path class="row-chev" d="M309 114 L315 120 L309 126" fill="none" stroke="#eaf9ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </a>

          <a href="proyectos.html#harness-manager" aria-label="Ir a Harness Manager">
            <rect class="row-bg" x="12" y="142" width="318" height="40" rx="8" />

        <!-- Logros board: the painted "Test Execution" screen is a link.

          <!-- Screen halo: drawn in panel-local space so it follows the
               board's perspective exactly -->
          <g transform="matrix(0.858,-0.057,0.033,0.850,1097.5,208.3)">
            <rect class="board-link-bg" x="-15" y="-19" width="370" height="232" rx="20" />

      <!-- Real links: keyboard, SEO and semantic layer over the 3D canvas -->
      <nav class="sr-only" aria-label="Secciones del portfolio">
        <a id="sr-about" href="about.html">About Me</a>
        <a id="sr-p1" href="proyectos.html#harness-manager">Harness Manager</a>
        <a id="sr-p2" href="proyectos.html#qa-flow-checklists">QA Checklist</a>
        <a id="sr-p3" href="proyectos.html#jira-traceability">Jira Traceability Manager</a>
      </nav>
    </main>

    <script>
      // ---------- ES/EN language switch ----------
      (function () {
        var I18N = {
          es: { language: 'Idioma', about: 'Sobre mí' },
          en: { language: 'Language', about: 'About Me' }
        };

        var lang = 'es';
        try {
          lang = localStorage.getItem('portfolio-lang') || 'es';
        } catch (e) {}

        function applyLang(next) {
          lang = next;
          try {
            localStorage.setItem('portfolio-lang', next);
          } catch (e) {}
          document.documentElement.lang = next;
          var t = I18N[next] || I18N.es;
          Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
            var key = el.getAttribute('data-i18n');
            if (t[key]) el.textContent = t[key];
          });
          Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) {
            var key = el.getAttribute('data-i18n-aria');
            if (t[key]) el.setAttribute('aria-label', t[key]);
          });
          Array.prototype.forEach.call(document.querySelectorAll('.lang-switch button'), function (b) {
            b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === next));
          });
          // The 3D menu listens for this to swap its own labels.
          window.dispatchEvent(new CustomEvent('langchange', { detail: { lang: next } }));
        }

        Array.prototype.forEach.call(document.querySelectorAll('.lang-switch button'), function (b) {
          b.addEventListener('click', function () {
            applyLang(b.getAttribute('data-lang'));
          });
        });

        applyLang(lang);
      })();
    </script>

    <script type="module">
      import * as THREE from './assets/vendor/three.module.min.js';

      const wrap = document.getElementById('chart-wrap');
      const canvas = document.getElementById('chart');
      const labelEl = document.getElementById('chart-label');
      const labelTextEl = document.getElementById('chart-label-text');

      // Menu data: center + 3 outer segments (Chrome-style palette)
      const MENU = [
        {
          id: 'about',
          kind: 'center',
          label: 'About Me',
          href: 'about.html',
          color: 0x0059bf, // white (About Me)
          css: '#ffffff',
          sr: 'sr-about'
        },
        {
          id: 'p1',
          kind: 'segment',
          label: 'Harness Manager',
          href: 'proyectos.html#harness-manager',
          color: 0xff3355, // neon red
          css: '#ffffff',
          sr: 'sr-p1',
          center: 90
        },
        {
          id: 'p2',
          kind: 'segment',
          label: 'QA Checklist',
          href: 'proyectos.html#qa-flow-checklists',
          color: 0xffe600, // neon yellow
          css: '#ffffff',
          sr: 'sr-p2',
          center: -30
        },
        {
          id: 'p3',
          kind: 'segment',
          label: 'Jira Traceability Manager',
          href: 'proyectos.html#jira-traceability',
          color: 0x2bff88, // neon green
          css: '#ffffff',
          sr: 'sr-p3',
          center: 210
        }
      ];

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      } catch (err) {
        document.body.classList.add('no-webgl');
      }

      if (renderer) {
        init(renderer);
      }

      function init(renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearAlpha(0);
        // Soft shadows: the chart drops a shadow onto an invisible floor so it
        // reads as resting on the desk painted in the background image.
        // (r186 removed PCFSoftShadowMap; PCFShadowMap + radius gives the blur.)
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        // Camera at the previous 3/4 angle, aimed at the chart's mid-height
        // so it reads centered on screen (arrows align with its center).
        camera.position.set(5.5, 5.5, 7);
        camera.lookAt(0, 2.4, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 1.15);
        // Almost overhead but biased toward the camera, so the shading on the
        // front faces stays nice (the shadow itself comes from the back light).
        key.position.set(1.5, 9, 4);
        scene.add(key);
        // Back light: casts the shadow toward the viewer so the pool of shade
        // lands on the desk in front of the chart where it is visible.
        const sun = new THREE.DirectionalLight(0xffffff, 0.6);
        sun.position.set(-4, 7, -8);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.camera.left = -5;
        sun.shadow.camera.right = 5;
        sun.shadow.camera.top = 5;
        sun.shadow.camera.bottom = -5;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 30;
        sun.shadow.bias = -0.0006;
        sun.shadow.normalBias = 0.03;
        sun.shadow.radius = 5; // soft penumbra
        sun.shadow.camera.updateProjectionMatrix();
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xaaccff, 0.5);
        fill.position.set(-4, -2, 3);
        scene.add(fill);

        // Ceiling-lamp light source: warm spot hanging above the chart
        const lamp = new THREE.SpotLight(0xfff2d8, 26, 0, 0.7, 0.7, 2);
        lamp.position.set(0, 4.6, 2.6);
        lamp.target.position.set(0, 0, 0);
        scene.add(lamp);
        scene.add(lamp.target);

        const group = new THREE.Group();
        // The canvas is 136% of the wrap (hover headroom); scale the scene so
        // the chart keeps exactly the same on-screen size and position.
        group.scale.setScalar(1 / 1.26);
        // Chart STANDING vertically on the ground (bottom edge at y=0). With
        // rotation.x = -π/2 the disc plane becomes vertical; local +z (the STRETCH
        // axis) maps to world +y, so hovered sectors stretch UPWARD from the floor.
        const BASE_TILT = -Math.PI / 2;
        group.rotation.x = BASE_TILT;
        group.position.y = 2.0; // R_OUT ≈ 2.0 -> bottom of the disc rests on y=0
        scene.add(group);

        const DEG = Math.PI / 180;
        const R_OUT = 2.0; // outer radius of colored ring
        const R_IN = 1.16; // inner radius of colored ring
        const WHITE_IN = 0.94; // white ring inner radius
        const WHITE_OUT = 1.2; // white ring outer (tucked under the colored ring)
        const BLUE_R = 0.9; // center disc radius
        const DEPTH = 0.7; // extrusion depth: sections extrude upward from the pie base
        // Bevels grow each sector by bevelSize on every side, so the real gap
        // at the inner radius must stay wider than 2 * bevelSize: otherwise
        // neighbouring sectors intersect (visible overlap at the seams).
        const GAP = 2.8 * DEG;

        function sectorShape(ri, ro, a1, a2) {
          const s = new THREE.Shape();
          s.moveTo(Math.cos(a1) * ro, Math.sin(a1) * ro);
          s.absarc(0, 0, ro, a1, a2, false);
          s.lineTo(Math.cos(a2) * ri, Math.sin(a2) * ri);
          s.absarc(0, 0, ri, a2, a1, true);
          s.closePath();
          return s;
        }

        const extrude = {
          depth: DEPTH,
          bevelEnabled: true,
          bevelThickness: 0.04,
          bevelSize: 0.025,
          bevelSegments: 3,
          curveSegments: 64
        };

        const meshes = [];

        // 3 outer segments (interactive)
        MENU.filter((m) => m.kind === 'segment').forEach((m) => {
          const a1 = (m.center - 60) * DEG + GAP / 2;
          const a2 = (m.center + 60) * DEG - GAP / 2;
          const geo = new THREE.ExtrudeGeometry(sectorShape(R_IN, R_OUT, a1, a2), extrude);
          const mat = new THREE.MeshStandardMaterial({
            color: m.color,
            roughness: 1,
            metalness: 0.04
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.userData = { entry: m, baseEmissive: 0.2 }; // neon glow at rest
          group.add(mesh);
          meshes.push(mesh);
        });

        // White ring (decorative) — slightly shallower than the colored ring so
        // its top face never sits coplanar with the sectors (avoids z-fighting)
        const ringGeo = new THREE.ExtrudeGeometry(
          sectorShape(WHITE_IN, WHITE_OUT, 0, Math.PI * 2),
          { ...extrude, depth: DEPTH - 0.07 }
        );
        group.add(
          new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x0a2a55, roughness: 0.5 }))
        );

        // Center disc (interactive)
        const centerEntry = MENU.find((m) => m.kind === 'center');
        const CENTER_H = DEPTH * 1.6; // center is taller but shares the sections' base plane
        const blueGeo = new THREE.CylinderGeometry(BLUE_R, BLUE_R, CENTER_H, 64);
        // CylinderGeometry's axis is +Y; rotate 90deg so the axis becomes local +Z,
        // which the standing group maps to world +Y -> the center extrudes upward.
        blueGeo.rotateX(Math.PI / 2);
        const blueMat = new THREE.MeshStandardMaterial({
          color: 0x0059bf,
          roughness: 0.55,
          metalness: 0.08,
          emissive: centerEntry.color,
          emissiveIntensity: 0
        });
        const blueMesh = new THREE.Mesh(blueGeo, blueMat);
        // Cylinder geometry is centered on its own origin, so lift it by half its
        // height: its base now sits at local z=0, exactly like the sections.
        // Same base plane, same upward face as the rest of the chart.
        blueMesh.position.z = CENTER_H / 2;
        blueMesh.userData = { entry: centerEntry, baseEmissive: 0.2 };
        group.add(blueMesh);
        meshes.push(blueMesh);

        // ---------- Shadows ----------
        // Every chart piece casts; an invisible plane catches the shadow so the
        // chart reads as resting on the desk painted in the background image.
        group.traverse((obj) => {
          if (obj.isMesh) obj.castShadow = true;
        });

        // The floor sits exactly at the chart's lowest point (computed from the
        // real bounding box, so it follows any future geometry changes).
        group.updateMatrixWorld(true);
        const baseY = new THREE.Box3().setFromObject(group).min.y;
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(60, 60),
          new THREE.ShadowMaterial({ opacity: 0.62, color: 0x00040c })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = baseY + 0.02;
        floor.receiveShadow = true;
        scene.add(floor);

        // ---------- Interaction state ----------
        let hovered = null; // mesh under the pointer (mouse)

        // Sectors that present a "clickable" hand cursor on hover.
        // Keep in sync with MENU entries that are meant to read as links.
        const POINTER_HOVER_IDS = new Set(['about', 'p1', 'p2', 'p3']);
        let selected = null; // mesh tapped (touch)
        let focused = null; // mesh whose sr link has keyboard focus

        function activeMesh() {
          return hovered || focused || selected;
        }

        function updateLabel() {
          const mesh = activeMesh();
          if (mesh) {
            labelTextEl.textContent = mesh.userData.entry.label;
            labelEl.style.color = mesh.userData.entry.css;
            labelEl.classList.add('is-visible');
          } else {
            labelEl.classList.remove('is-visible');
          }
        }

        // The "About Me" label follows the ES/EN switch (product names stay).
        function applyChartLang(lang) {
          const about = MENU.find((m) => m.id === 'about');
          if (about) about.label = lang === 'en' ? 'About Me' : 'Sobre mí';
          if (labelEl.classList.contains('is-visible')) updateLabel();
        }
        applyChartLang(document.documentElement.lang || 'es');
        window.addEventListener('langchange', (e) => applyChartLang(e.detail.lang));

        function act(mesh) {
          const href = mesh.userData.entry.href;
          if (href && href !== '#') window.location.href = href;
        }

        // ---------- Pointer (mouse hover + touch 2-tap) ----------
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2();

        function pick(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObjects(meshes, false);
          return hits.length ? hits[0].object : null;
        }

        function updateHoverCursor(hit) {
          // Hand cursor only over the sections that are meant to read as links.
          canvas.style.cursor = hit && POINTER_HOVER_IDS.has(hit.userData.entry.id) ? 'pointer' : 'default';
        }

        canvas.addEventListener('pointermove', (e) => {
          if (e.pointerType !== 'mouse') return;
          const hit = pick(e.clientX, e.clientY);
          if (hit !== hovered) {
            hovered = hit;
            updateLabel();
          }
          updateHoverCursor(hit);
        });

        canvas.addEventListener('pointerleave', () => {
          if (hovered) {
            hovered = null;
            updateLabel();
          }
          updateHoverCursor(null);
        });

        canvas.addEventListener('pointerup', (e) => {
          if (e.pointerType === 'mouse') {
            const hit = pick(e.clientX, e.clientY);
            if (hit) act(hit);
            return;
          }
          // Touch: first tap selects (stretches + shows name), second tap navigates
          const hit = pick(e.clientX, e.clientY);
          if (!hit) {
            selected = null;
          } else if (selected !== hit) {
            selected = hit;
          } else {
            act(hit);
          }
          updateLabel();
        });

        // ---------- Keyboard: sr links drive the 3D highlight ----------
        MENU.forEach((m) => {
          const el = document.getElementById(m.sr);
          const mesh = meshes.find((x) => x.userData.entry === m);
          el.addEventListener('focus', () => {
            focused = mesh;
            updateLabel();
          });
          el.addEventListener('blur', () => {
            if (focused === mesh) focused = null;
            updateLabel();
          });
        });

        // ---------- Scroll / arrow keys / side arrows: rotate the menu ----------
        const MENU_STEP = (Math.PI * 2) / 3; // one sector position per click
        // Camera sits at (5.5, 4.5, 5.5): horizontal direction +X/+Z (45deg).
        // A sector with local center angle C points at world angle C+z, so
        // z = -45deg - C puts it exactly in front of the user.
        const FACE_USER = -Math.PI / 4;

        // Start with the first sector exactly facing the user.
        const firstSegment = MENU.find((m) => m.kind === 'segment');
        let targetZ = FACE_USER - firstSegment.center * DEG;
        group.rotation.z = targetZ;

        // Traversal order: the center (About Me) is part of the arrow list too.
        const NAV_ORDER = ['about', 'p1', 'p2', 'p3'];
        let navIdx = 1; // first segment is in front at load

        // One click = one position, endlessly, in the requested direction.
        function rotateMenu(dir) {
          navIdx = (navIdx + dir + NAV_ORDER.length) % NAV_ORDER.length;
          const entry = MENU.find((m) => m.id === NAV_ORDER[navIdx]) || null;
          if (entry && entry.kind === 'segment') {
            targetZ += dir * MENU_STEP;
          }
          const mesh = entry ? meshes.find((m) => m.userData.entry === entry) : null;
          if (mesh) {
            hovered = mesh;
            updateLabel();
          }
        }

        document.querySelector('.chart-arrow--left').addEventListener('click', () => {
          rotateMenu(-1);
        });
        document.querySelector('.chart-arrow--right').addEventListener('click', () => {
          rotateMenu(1);
        });

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          targetZ += e.deltaY * 0.005;
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          const tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); rotateMenu(1); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); rotateMenu(-1); }
        });

        // ---------- Resize ----------
        function resize() {
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);

        // ---------- Animation loop ----------
        const STRETCH = 0.25; // hovered sector stretches along local z (= world Y when standing) instead of lifting
        function tick() {
          // group.rotation.x stays at BASE_TILT (kept for 3D appreciation).
          // Ease the chart toward the rotation that faces the active sector.
          group.rotation.z += (targetZ - group.rotation.z) * 0.18;

          const active = activeMesh();
          meshes.forEach((mesh) => {
            const on = mesh === active;
            // Grow ONLY along local z (world up): the section extrudes upward,
            // never widens sideways.
            mesh.scale.z += ((on ? 1 + STRETCH : 1) - mesh.scale.z) * 0.16;
            mesh.material.emissive.setHex(mesh.userData.entry.color);
            const base = mesh.userData.baseEmissive || 0;
            mesh.material.emissiveIntensity = on ? base + 0.35 : base;
          });

          renderer.render(scene, camera);
          requestAnimationFrame(tick);
        }
        tick();
      }
    </script>
  </body>
</html>
