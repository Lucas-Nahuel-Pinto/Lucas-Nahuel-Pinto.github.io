<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucas Pinto — Portfolio</title>
    <meta
      name="description"
      content="Menú principal 3D en forma de gráfico de torta: About Me y proyectos personales de Lucas Pinto."
    />
    <style>
      :root {
        --font-heading: "HelveticaNowDisplay-Medium", "Helvetica Neue", Arial, sans-serif;
        --chrome-red: #ea4335;
        --chrome-yellow: #fbbc05;
        --chrome-green: #34a853;
        --chrome-blue: #4285f4;
        --focus: #facc15;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        font-family: var(--font-heading);
        color: #fff;
        background-color: #030a14; /* fallback while / while the image loads */
        background-image: url("/mainPage-bg.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* ---------- Navbar (same as about.html) ---------- */
      .site-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.25rem;
      }
      .site-nav .logo {
        font-size: clamp(21px, 4vw, 26px);
        letter-spacing: -0.02em;
        color: #fff;
        text-decoration: none;
        user-select: none;
      }
      .site-nav .contact {
        font-size: clamp(17px, 3vw, 23px);
        color: #fff;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .site-nav .contact:hover,
      .site-nav .logo:hover {
        opacity: 0.7;
      }
      .site-nav a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
        border-radius: 2px;
      }

      /* ---------- Stage ---------- */
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4.5rem 1rem 2rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .chart-wrap {
        position: relative;
        /* 30% bigger than the previous 378px */
        width: min(71vmin, 491px);
        aspect-ratio: 1 / 1;
      }
      .chart-wrap canvas {
        /* The canvas is larger than the wrap: the hovered segment pops out
           (scale + z-stretch) and would otherwise be clipped by
           the canvas edge. The pie keeps its visual size and center. */
        position: absolute;
        left: -18%;
        top: -18%;
        width: 136%;
        height: 136%;
        display: block;
        touch-action: manipulation;
      }
      .chart-wrap canvas:focus-visible {
        outline: none;
      }

      /* Minimalist side arrows (clickable): left / right of the chart */
      .chart-arrow {
        position: absolute;
        top: 50%;
        width: 18px;
        height: 10px;
        background: none;
        border: 0;
        padding: 0;
        opacity: 0.55;
        cursor: pointer;
        transform: translateY(-50%);
        z-index: 5;
      }
      .chart-arrow svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .chart-arrow--left {
        left: 6px;
      }
      .chart-arrow--right {
        right: 6px;
      }
      .chart-arrow:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
        border-radius: 2px;
      }

      /* Hover/selection label below the chart */
      #chart-label {
        /* Sits just below the pie: absolute inside .chart-wrap, so the gap
           scales with the chart size (pie bottom ~= 73% of the wrap height). */
        position: absolute;
        left: 0;
        right: 0;
        top: 77%;
        z-index: 2;
        display: flex;
        justify-content: center;
        padding: 0 6px;
        margin: 0;
        pointer-events: none;
        color: #fff; /* the JS overrides this with the section's neon color */
        opacity: 0;
        transition: opacity 0.2s ease;
        user-select: none;
      }
      #chart-label.is-visible {
        opacity: 1;
      }

      /* Holographic HUD panel: same futuristic-cartoon language as the
         intro background (glowing cyan rim, glowing blue glass, glossy sheen).
         The dark glass guarantees contrast for the neon section color. */
      #chart-label-text {
        position: relative;
        display: inline-block;
        max-width: 100%;
        padding: 0.38em 1em 0.44em;
        font-size: clamp(1rem, 2.7vw, 1.45rem);
        line-height: 1.25;
        text-align: center;
        letter-spacing: 0.02em;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 30%, rgba(255, 255, 255, 0) 50%),
          linear-gradient(180deg, rgba(0, 170, 255, 0.30) 0%, rgba(0, 70, 175, 0.55) 55%, rgba(1, 22, 74, 0.84) 100%);
        border: 2px solid rgba(126, 232, 255, 0.95);
        border-radius: 14px;
        box-shadow:
          0 0 12px rgba(80, 215, 255, 0.65),
          0 0 30px rgba(0, 150, 255, 0.35),
          inset 0 0 18px rgba(80, 215, 255, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
        text-shadow:
          0 0 8px currentColor,
          0 0 2px rgba(255, 255, 255, 0.65),
          0 1px 3px rgba(0, 0, 0, 0.8);
        white-space: normal;
        overflow-wrap: anywhere;
      }

      /* ---------- Fallback (no WebGL) ---------- */
      #fallback {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        text-align: center;
      }
      .no-webgl #fallback {
        display: flex;
      }
      .no-webgl canvas {
        display: none;
      }
      #fallback a {
        color: #fff;
        text-decoration: none;
        font-size: clamp(1.2rem, 4vw, 1.8rem);
        padding: 0.5em 1.2em;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 999px;
      }
      #fallback a:hover {
        border-color: #fff;
      }
      #fallback a:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <!-- Navbar (same as about.html) -->
    <nav class="site-nav">
      <a class="logo" href="#">Lucas Pinto</a>
      <a class="contact" href="#" data-contact rel="nofollow noopener">Contactar</a>
    </nav>

    <main class="stage">
      <h1 class="sr-only">Lucas Pinto — Portfolio</h1>

      <div id="chart-wrap" class="chart-wrap">
        <canvas id="chart"></canvas>

        <!-- Minimalist side arrows (rotate menu) -->
        <button type="button" class="chart-arrow chart-arrow--left" aria-label="Seccion anterior">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M9 1 L1 5 L9 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="chart-arrow chart-arrow--right" aria-label="Seccion siguiente">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M1 1 L9 5 L1 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- Visible fallback when WebGL is unavailable -->
        <div id="fallback">
          <a href="about.html">About Me</a>
          <a href="#">QA Checklist</a>
          <a href="#">Jira Traceability Manager</a>
          <a href="#">Harness Manager</a>
        </div>

        <!-- Name of the active section, right below the chart -->
        <p id="chart-label" aria-live="polite"><span id="chart-label-text"></span></p>
      </div>

      <!-- Real links: keyboard, SEO and semantic layer over the 3D canvas -->
      <nav class="sr-only" aria-label="Secciones del portfolio">
        <a id="sr-about" href="about.html">About Me</a>
        <a id="sr-p1" href="#">QA Checklist</a>
        <a id="sr-p2" href="#">Jira Traceability Manager</a>
        <a id="sr-p3" href="#">Harness Manager</a>
      </nav>
    </main>

    <script>
      // Anti-scraping contact: the address never appears in the HTML source;
      // it is assembled at runtime only when the user clicks Contactar.
      (function () {
        var addr =
          ['pinto', 'lucas', 'nahuel'].join('.') +
          String.fromCharCode(64) +
          ['gmail', 'com'].join('.');
        Array.prototype.forEach.call(document.querySelectorAll('[data-contact]'), function (el) {
          el.addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = 'mailto:' + addr;
          });
        });
      })();
    </script>

    <script type="module">
      import * as THREE from './assets/vendor/three.module.min.js';

      const wrap = document.getElementById('chart-wrap');
      const canvas = document.getElementById('chart');
      const labelEl = document.getElementById('chart-label');
      const labelTextEl = document.getElementById('chart-label-text');

      // Menu data: center + 3 outer segments (Chrome-style palette)
      const MENU = [
        {
          id: 'about',
          kind: 'center',
          label: 'About Me',
          href: 'about.html',
          color: 0x59d8ff, // light neon blue (About Me)
          css: '#59d8ff',
          sr: 'sr-about'
        },
        {
          id: 'p1',
          kind: 'segment',
          label: 'QA Checklist',
          href: '#',
          color: 0xff3355, // neon red
          css: '#ff3355',
          sr: 'sr-p1',
          center: 90
        },
        {
          id: 'p2',
          kind: 'segment',
          label: 'Jira Traceability Manager',
          href: '#',
          color: 0xffe600, // neon yellow
          css: '#ffe600',
          sr: 'sr-p2',
          center: -30
        },
        {
          id: 'p3',
          kind: 'segment',
          label: 'Harness Manager',
          href: '#',
          color: 0x2bff88, // neon green
          css: '#2bff88',
          sr: 'sr-p3',
          center: 210
        }
      ];

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      } catch (err) {
        document.body.classList.add('no-webgl');
      }

      if (renderer) {
        init(renderer);
      }

      function init(renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearAlpha(0);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
        // Camera at a pleasing 3/4 angle so we see the chart from the side,
        // aimed at the chart's mid-height so it reads centered on screen.
        camera.position.set(5.5, 4.5, 5.5);
        camera.lookAt(0, 2.4, 0);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const key = new THREE.DirectionalLight(0xffffff, 1.15);
        key.position.set(3, 5, 6);
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xaaccff, 0.5);
        fill.position.set(-4, -2, 3);
        scene.add(fill);

        // Ceiling-lamp light source: warm spot hanging above the chart
        const lamp = new THREE.SpotLight(0xfff2d8, 26, 0, 0.7, 0.7, 2);
        lamp.position.set(0, 4.6, 2.6);
        lamp.target.position.set(0, 0, 0);
        scene.add(lamp);
        scene.add(lamp.target);

        const group = new THREE.Group();
        // The canvas is 136% of the wrap (hover headroom); scale the scene so
        // the chart keeps exactly the same on-screen size and position.
        group.scale.setScalar(1 / 1.36);
        // Chart STANDING vertically on the ground (bottom edge at y=0). With
        // rotation.x = -π/2 the disc plane becomes vertical; local +z (the STRETCH
        // axis) maps to world +y, so hovered sectors stretch UPWARD from the floor.
        const BASE_TILT = -Math.PI / 2;
        group.rotation.x = BASE_TILT;
        group.position.y = 2.0; // R_OUT ≈ 2.0 -> bottom of standing disc rests on y=0
        scene.add(group);

        const DEG = Math.PI / 180;
        const R_OUT = 2.0; // outer radius of colored ring
        const R_IN = 1.16; // inner radius of colored ring
        const WHITE_IN = 0.94; // white ring inner radius
        const WHITE_OUT = 1.2; // white ring outer (tucked under the colored ring)
        const BLUE_R = 0.9; // center disc radius
        const DEPTH = 0.6; // extrusion depth: sections extrude upward from the pie base
        const GAP = 1.6 * DEG; // gap between segments (menu affordance)

        function sectorShape(ri, ro, a1, a2) {
          const s = new THREE.Shape();
          s.moveTo(Math.cos(a1) * ro, Math.sin(a1) * ro);
          s.absarc(0, 0, ro, a1, a2, false);
          s.lineTo(Math.cos(a2) * ri, Math.sin(a2) * ri);
          s.absarc(0, 0, ri, a2, a1, true);
          s.closePath();
          return s;
        }

        const extrude = {
          depth: DEPTH,
          bevelEnabled: true,
          bevelThickness: 0.04,
          bevelSize: 0.04,
          bevelSegments: 3,
          curveSegments: 64
        };

        const meshes = [];

        // 3 outer segments (interactive)
        MENU.filter((m) => m.kind === 'segment').forEach((m) => {
          const a1 = (m.center - 60) * DEG + GAP / 2;
          const a2 = (m.center + 60) * DEG - GAP / 2;
          const geo = new THREE.ExtrudeGeometry(sectorShape(R_IN, R_OUT, a1, a2), extrude);
          const mat = new THREE.MeshStandardMaterial({
            color: m.color,
            roughness: 0.42,
            metalness: 0.04
          });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.userData = { entry: m, baseEmissive: 0.2 }; // neon glow at rest
          group.add(mesh);
          meshes.push(mesh);
        });

        // White ring (decorative) — slightly shallower than the colored ring so
        // its top face never sits coplanar with the sectors (avoids z-fighting)
        const ringGeo = new THREE.ExtrudeGeometry(
          sectorShape(WHITE_IN, WHITE_OUT, 0, Math.PI * 2),
          { ...extrude, depth: DEPTH - 0.07 }
        );
        group.add(
          new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.5 }))
        );

        // Center disc (interactive)
        const centerEntry = MENU.find((m) => m.kind === 'center');
        const CENTER_H = DEPTH * 1.6; // center is taller but shares the sections' base plane
        const blueGeo = new THREE.CylinderGeometry(BLUE_R, BLUE_R, CENTER_H, 64);
        // CylinderGeometry's axis is +Y; rotate 90deg so the axis becomes local +Z,
        // which the standing group maps to world +Y -> the center extrudes upward.
        blueGeo.rotateX(Math.PI / 2);
        const blueMat = new THREE.MeshStandardMaterial({
          // Near-black base so the warm lamp can't grey it out; the background
          // blue comes almost entirely from emissive (see baseEmissive below).
          color: 0x01050e,
          roughness: 0.85,
          metalness: 1,
          emissive: centerEntry.color,
          emissiveIntensity: 1
        });
        const blueMesh = new THREE.Mesh(blueGeo, blueMat);
        // Cylinder geometry is centered on its own origin, so lift it by half its
        // height: its base now sits at local z=0, exactly like the sections.
        // Same base plane, same upward face as the rest of the chart.
        blueMesh.position.z = CENTER_H / 2;
        blueMesh.userData = { entry: centerEntry, baseEmissive: 0.2 };
        group.add(blueMesh);
        meshes.push(blueMesh);

        // ---------- Interaction state ----------
        let hovered = null; // mesh under the pointer (mouse)
        let selected = null; // mesh tapped (touch)
        let focused = null; // mesh whose sr link has keyboard focus

        function activeMesh() {
          return hovered || focused || selected;
        }

        function updateLabel() {
          const mesh = activeMesh();
          if (mesh) {
            labelTextEl.textContent = mesh.userData.entry.label;
            labelEl.style.color = mesh.userData.entry.css;
            labelEl.classList.add('is-visible');
          } else {
            labelEl.classList.remove('is-visible');
          }
        }

        function act(mesh) {
          const href = mesh.userData.entry.href;
          if (href && href !== '#') window.location.href = href;
        }

        // ---------- Pointer (mouse hover + touch 2-tap) ----------
        const raycaster = new THREE.Raycaster();
        const ndc = new THREE.Vector2();

        function pick(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(ndc, camera);
          const hits = raycaster.intersectObjects(meshes, false);
          return hits.length ? hits[0].object : null;
        }

        canvas.addEventListener('pointermove', (e) => {
          if (e.pointerType !== 'mouse') return;
          const hit = pick(e.clientX, e.clientY);
          if (hit !== hovered) {
            hovered = hit;
            updateLabel();
          }
        });

        canvas.addEventListener('pointerleave', () => {
          if (hovered) {
            hovered = null;
            updateLabel();
          }
        });

        canvas.addEventListener('pointerup', (e) => {
          if (e.pointerType === 'mouse') {
            const hit = pick(e.clientX, e.clientY);
            if (hit) act(hit);
            return;
          }
          // Touch: first tap selects (stretches + shows name), second tap navigates
          const hit = pick(e.clientX, e.clientY);
          if (!hit) {
            selected = null;
          } else if (selected !== hit) {
            selected = hit;
          } else {
            act(hit);
          }
          updateLabel();
        });

        // ---------- Keyboard: sr links drive the 3D highlight ----------
        MENU.forEach((m) => {
          const el = document.getElementById(m.sr);
          const mesh = meshes.find((x) => x.userData.entry === m);
          el.addEventListener('focus', () => {
            focused = mesh;
            updateLabel();
          });
          el.addEventListener('blur', () => {
            if (focused === mesh) focused = null;
            updateLabel();
          });
        });

        // ---------- Scroll / arrow keys / side arrows: rotate the menu ----------
        const MENU_STEP = (Math.PI * 2) / 3; // one sector position per click
        // Camera sits at (5.5, 4.5, 5.5): horizontal direction +X/+Z (45deg).
        // A sector with local center angle C points at world angle C+z, so
        // z = -45deg - C puts it exactly in front of the user.
        const FACE_USER = -Math.PI / 4;

        // Start with the first sector exactly facing the user.
        const firstSegment = MENU.find((m) => m.kind === 'segment');
        let targetZ = FACE_USER - firstSegment.center * DEG;
        group.rotation.z = targetZ;

        // Traversal order: the center (About Me) is part of the arrow list too.
        const NAV_ORDER = ['about', 'p1', 'p2', 'p3'];
        let navIdx = 1; // first segment is in front at load

        // One click = one position, endlessly, in the requested direction.
        function rotateMenu(dir) {
          navIdx = (navIdx + dir + NAV_ORDER.length) % NAV_ORDER.length;
          const entry = MENU.find((m) => m.id === NAV_ORDER[navIdx]) || null;
          if (entry && entry.kind === 'segment') {
            targetZ += dir * MENU_STEP;
          }
          const mesh = entry ? meshes.find((m) => m.userData.entry === entry) : null;
          if (mesh) {
            hovered = mesh;
            updateLabel();
          }
        }

        document.querySelector('.chart-arrow--left').addEventListener('click', () => {
          rotateMenu(-1);
        });
        document.querySelector('.chart-arrow--right').addEventListener('click', () => {
          rotateMenu(1);
        });

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          targetZ += e.deltaY * 0.005;
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          const tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); rotateMenu(1); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); rotateMenu(-1); }
        });

        // ---------- Resize ----------
        function resize() {
          const w = canvas.clientWidth;
          const h = canvas.clientHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        }
        resize();
        window.addEventListener('resize', resize);

        // ---------- Animation loop ----------
        const STRETCH = 0.35; // hovered sector stretches along local z (= world Y when standing) instead of lifting
        function tick() {
          // group.rotation.x stays at BASE_TILT (kept for 3D appreciation).
          // Ease the chart toward the rotation that faces the active sector.
          group.rotation.z += (targetZ - group.rotation.z) * 0.18;

          const active = activeMesh();
          meshes.forEach((mesh) => {
            const on = mesh === active;
            // Grow ONLY along local z (world up): the section extrudes upward,
            // never widens sideways.
            mesh.scale.z += ((on ? 1 + STRETCH : 1) - mesh.scale.z) * 0.16;
            mesh.material.emissive.setHex(mesh.userData.entry.color);
            const base = mesh.userData.baseEmissive || 0;
            mesh.material.emissiveIntensity = on ? base + 0.35 : base;
          });

          renderer.render(scene, camera);
          requestAnimationFrame(tick);
        }
        tick();
      }
    </script>
  </body>
</html>
