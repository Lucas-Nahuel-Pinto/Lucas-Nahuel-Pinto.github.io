    <style>
      /* Centered hero column (mx-auto/text-center not in compiled CSS) */
      .wheel-wrap {
        margin-inline: auto;
        align-items: center;
        text-align: center;
      }
      /* Minimalist scroll hints above/below the wheel (clickable) */
      .wheel-hint {
        display: block;
        width: 18px;
        height: 10px;
        margin-inline: auto;
        padding: 0;
        border: 0;
        background: none;
        opacity: 0.55;
        cursor: pointer;
      }
      .wheel-hint--up {
        margin-bottom: 10px;
      }
      .wheel-hint--down {
        margin-top: 10px;
      }
      .wheel-hint:focus-visible {
        outline: 2px solid #facc15;
        outline-offset: 4px;
        border-radius: 2px;
      }
      /* Infinite-loop depth wheel menu: 3 slots, only the center item is selectable */
      #wheel {
        --wheel-slot: clamp(42px, 9vw, 62px);
        height: calc(var(--wheel-slot) * 3);
        outline: none;
        user-select: none;
      }
      .wheel-item {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        display: block;
        font-family: var(--font-heading);
        font-size: clamp(22px, 5.5vw, 38px);
        line-height: 1.2;
        color: #fff;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
        transform: translateY(calc(-50% + var(--dy, 0px))) scale(var(--sc, 1));
        transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
        will-change: transform, filter;
      }
      .wheel-item[data-slot="-2"] {
        --dy: calc(var(--wheel-slot) * -2);
        --sc: 0.7;
        filter: blur(6px);
        opacity: 0;
        pointer-events: none;
      }
      .wheel-item[data-slot="-1"] {
        --dy: calc(var(--wheel-slot) * -1);
        --sc: 0.82;
        filter: blur(3.5px);
        opacity: 0.7;
        pointer-events: none;
      }
      .wheel-item[data-slot="0"] {
        --dy: 0px;
        --sc: 1;
        filter: none;
        opacity: 1;
        cursor: pointer;
        color: #facc15;
      }
      .wheel-item[data-slot="1"] {
        --dy: var(--wheel-slot);
        --sc: 0.82;
        filter: blur(3.5px);
        opacity: 0.7;
        pointer-events: none;
      }
      .wheel-item[data-slot="2"] {
        --dy: calc(var(--wheel-slot) * 2);
        --sc: 0.7;
        opacity: 0;
        pointer-events: none;
      }
      .wheel-item[data-slot="0"]:focus-visible {
        outline: 2px solid #facc15;
        outline-offset: 4px;
        border-radius: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .wheel-item {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="relative min-h-screen w-full bg-black text-white select-none overflow-hidden">
      <!-- BACKGROUND VIDEO (mouse-scrub controlled) -->
      <video
        id="scrub-video"
        muted
        playsinline
        preload="auto"
        class="pointer-events-none fixed inset-0 z-0 h-full w-full object-cover [object-position:70%_center]"
        style="position: fixed; inset: 0; z-index: 0; object-fit: cover; object-position: 70% center;"
      >
        <source src="/assets/aistudio/face-aboutMe_030dc440.mp4" type="video/mp4" />
      </video>

      <!-- NAVBAR (fixed, z-index: 10) -->
      <nav class="fixed top-0 left-0 right-0 z-10 w-full px-5 sm:px-8 py-4 sm:py-5 flex flex-row justify-between items-center bg-transparent">
        <!-- Logo (left) -->
        <div class="flex flex-row items-center gap-3">
          <a
            href="#"
            class="text-[21px] sm:text-[26px] tracking-tight text-white select-none"
            style="font-family: var(--font-heading)"
          >
            Lucas Pinto
          </a>
          <span
            class="text-[25px] sm:text-[30px] text-white select-none leading-none"
            style="letter-spacing: -0.02em"
          >
            &#10035;&#65038;
          </span>
        </div>

        <!-- Desktop CTA (right, hidden below md) -->
        <div class="hidden md:block">
          <a
            href="#"
            data-contact
            rel="nofollow noopener"
            class="text-[23px] text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
          >
            Contactar
          </a>
        </div>

        <!-- Mobile hamburger (visible below md) -->
        <button
          type="button"
          id="menu-toggle"
          aria-label="Open Menu"
          class="md:hidden flex flex-col justify-center items-center w-8 h-8 gap-[5px] focus:outline-none cursor-pointer z-20"
        >
          <span
            id="burger-1"
            class="w-6 h-[2px] bg-white transition-all duration-300 origin-center rotate-0 translate-y-0"
          ></span>
          <span
            id="burger-2"
            class="w-6 h-[2px] bg-white transition-all duration-300 opacity-100"
          ></span>
          <span
            id="burger-3"
            class="w-6 h-[2px] bg-white transition-all duration-300 origin-center rotate-0 translate-y-0"
          ></span>
        </button>
      </nav>

      <!-- MOBILE OVERLAY (z-index: 9) -->
      <div
        id="mobile-menu"
        class="fixed inset-0 z-[9] bg-black/90 backdrop-blur-md flex flex-col justify-center px-8 gap-8 transition-opacity duration-300 md:hidden opacity-0 pointer-events-none"
      >
        <a
          href="about.html"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Sobre mí
        </a>
        <a
          href="#"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Proyectos
        </a>
        <a
          href="#"
          data-contact
          rel="nofollow noopener"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Contactar
        </a>
      </div>

      <!-- HERO SECTION (z-index: 1) -->
      <main class="relative z-[1] h-screen w-full flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 lg:px-16 overflow-hidden items-end">
        <div class="wheel-wrap max-w-xl w-full relative z-10 flex flex-col">
          <!-- Minimalist scroll hints (clickable) -->
          <button type="button" class="wheel-hint wheel-hint--up" aria-label="Sección anterior">
            <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M1 9 L9 1 L17 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <!-- DEPTH WHEEL MENU (3 slots, only the center item is selectable) -->
          <nav
            id="wheel"
            class="relative w-full overflow-hidden"
            lang="es"
            aria-label="Menú de secciones"
            tabindex="0"
          >
            <a class="wheel-item" data-slot="0" href="#experiencia">Experiencia</a>
            <a class="wheel-item" data-slot="1" href="#resueltos" inert aria-hidden="true" tabindex="-1">Logros</a>
            <a class="wheel-item" data-slot="2" href="#herramientas" inert aria-hidden="true" tabindex="-1">Herramientas</a>
            <a class="wheel-item" data-slot="-1" href="#proyectos" inert aria-hidden="true" tabindex="-1">Mis Proyectos</a>
          </nav>
          <button type="button" class="wheel-hint wheel-hint--down" aria-label="Sección siguiente">
            <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M1 1 L9 9 L17 1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </main>

    </div>

    <script>
      (function () {
        var video = document.getElementById('scrub-video');
        var targetTime = 0;
        var isSeeking = false;
        var prevX = null;
        var SENSITIVITY = 0.8;

        // Background video mouse-scrub controller
        function handleMouseMove(e) {
          if (!video || !video.duration || Number.isNaN(video.duration)) {
            prevX = e.clientX;
            return;
          }
          if (prevX === null) {
            prevX = e.clientX;
            return;
          }
          var delta = e.clientX - prevX;
          prevX = e.clientX;
          var timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          var newTarget = Math.max(0, Math.min(video.duration, targetTime + timeOffset));
          targetTime = newTarget;
          if (!isSeeking) {
            isSeeking = true;
            video.currentTime = newTarget;
          }
        }

        function handleMouseLeave() {
          prevX = null;
        }

        // Horizontal touch support for mobile scrubbing
        function handleTouchMove(e) {
          var touch = e.touches[0];
          if (!touch) return;
          if (!video || !video.duration || Number.isNaN(video.duration)) {
            prevX = touch.clientX;
            return;
          }
          if (prevX === null) {
            prevX = touch.clientX;
            return;
          }
          var delta = touch.clientX - prevX;
          prevX = touch.clientX;
          var timeOffset = (delta / window.innerWidth) * SENSITIVITY * video.duration;
          var newTarget = Math.max(0, Math.min(video.duration, targetTime + timeOffset));
          targetTime = newTarget;
          if (!isSeeking) {
            isSeeking = true;
            video.currentTime = newTarget;
          }
        }

        function handleTouchEnd() {
          prevX = null;
        }

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleTouchEnd);

        video.addEventListener('seeked', function () {
          if (Math.abs(video.currentTime - targetTime) > 0.02) {
            video.currentTime = targetTime;
          } else {
            isSeeking = false;
          }
        });

        video.addEventListener('loadedmetadata', function () {
          targetTime = video.currentTime || 0;
        });

        // Infinite-loop depth wheel menu (3 slots, center item selectable)
        var wheel = document.getElementById('wheel');
        var wheelItems = Array.prototype.slice.call(wheel.querySelectorAll('.wheel-item'));
        var wheelCenter = 0;
        var wheelLastStep = 0;
        var wheelAcc = 0;
        var WHEEL_STEP_MS = 300;
        var WHEEL_THRESHOLD = 40;

        function renderWheel() {
          var n = wheelItems.length;
          wheelItems.forEach(function (el, i) {
            var d = i - wheelCenter;
            if (d > n / 2) d -= n;
            if (d < -n / 2) d += n;
            el.setAttribute('data-slot', String(d));
            if (d === 0) {
              el.removeAttribute('inert');
              el.removeAttribute('aria-hidden');
              el.removeAttribute('tabindex');
            } else {
              el.setAttribute('inert', '');
              el.setAttribute('aria-hidden', 'true');
              el.setAttribute('tabindex', '-1');
            }
          });
        }

        function stepWheel(dir) {
          var now = Date.now();
          if (now - wheelLastStep < WHEEL_STEP_MS) return;
          wheelLastStep = now;
          var n = wheelItems.length;
          wheelCenter = (wheelCenter + dir + n) % n;
          renderWheel();
        }

        function activeWheelItem() {
          return wheelItems.filter(function (el) {
            return el.getAttribute('data-slot') === '0';
          })[0];
        }

        wheel.addEventListener('wheel', function (e) {
          e.preventDefault();
          var dy = e.deltaY;
          if (e.deltaMode === 1) dy *= 16;
          else if (e.deltaMode === 2) dy *= wheel.clientHeight;
          wheelAcc += dy;
          if (Math.abs(wheelAcc) >= WHEEL_THRESHOLD) {
            stepWheel(wheelAcc > 0 ? 1 : -1);
            wheelAcc = 0;
          }
        }, { passive: false });

        wheel.addEventListener('keydown', function (e) {
          if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === wheel) {
            e.preventDefault();
            var active = activeWheelItem();
            if (active) active.click();
          }
        });

        // Arrow/PageUp-PageDown navigation works from anywhere on the page
        document.addEventListener('keydown', function (e) {
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          var tag = (e.target.tagName || '').toLowerCase();
          if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
          if (e.key === 'ArrowDown' || e.key === 'PageDown') {
            e.preventDefault();
            stepWheel(1);
          } else if (e.key === 'ArrowUp' || e.key === 'PageUp') {
            e.preventDefault();
            stepWheel(-1);
          }
        });

        var wheelTouchY = null;
        wheel.addEventListener('touchstart', function (e) {
          wheelTouchY = e.touches[0].clientY;
        }, { passive: true });
        wheel.addEventListener('touchmove', function (e) {
          if (wheelTouchY === null) return;
          e.preventDefault();
          var dy = wheelTouchY - e.touches[0].clientY;
          if (Math.abs(dy) > 44) {
            stepWheel(dy > 0 ? 1 : -1);
            wheelTouchY = e.touches[0].clientY;
          }
        }, { passive: false });
        wheel.addEventListener('touchend', function () {
          wheelTouchY = null;
        });

        renderWheel();

        // Scroll hint arrows: one click = one wheel step
        document.querySelector('.wheel-hint--up').addEventListener('click', function () {
          stepWheel(-1);
        });
        document.querySelector('.wheel-hint--down').addEventListener('click', function () {
          stepWheel(1);
        });

        // Mobile hamburger menu
        var menuOpen = false;
        var overlay = document.getElementById('mobile-menu');
        var burger1 = document.getElementById('burger-1');
        var burger2 = document.getElementById('burger-2');
        var burger3 = document.getElementById('burger-3');
        var menuToggle = document.getElementById('menu-toggle');

        function setMenu(open) {
          menuOpen = open;
          menuToggle.setAttribute('aria-label', open ? 'Close Menu' : 'Open Menu');
          if (open) {
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100', 'pointer-events-auto');
            burger1.classList.remove('rotate-0', 'translate-y-0');
            burger1.classList.add('rotate-45', 'translate-y-[7px]');
            burger2.classList.remove('opacity-100');
            burger2.classList.add('opacity-0');
            burger3.classList.remove('rotate-0', 'translate-y-0');
            burger3.classList.add('-rotate-45', '-translate-y-[7px]');
          } else {
            overlay.classList.remove('opacity-100', 'pointer-events-auto');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            burger1.classList.remove('rotate-45', 'translate-y-[7px]');
            burger1.classList.add('rotate-0', 'translate-y-0');
            burger2.classList.remove('opacity-0');
            burger2.classList.add('opacity-100');
            burger3.classList.remove('-rotate-45', '-translate-y-[7px]');
            burger3.classList.add('rotate-0', 'translate-y-0');
          }
        }

        menuToggle.addEventListener('click', function () {
          setMenu(!menuOpen);
        });
        Array.prototype.forEach.call(document.querySelectorAll('.mobile-link'), function (link) {
          link.addEventListener('click', function () {
            setMenu(false);
          });
        });
      })();

      // Anti-scraping contact: the address never appears in the HTML source;
      // it is assembled at runtime only when the user clicks Contactar.
      (function () {
        var addr =
          ['pinto', 'lucas', 'nahuel'].join('.') +
          String.fromCharCode(64) +
          ['gmail', 'com'].join('.');
        Array.prototype.forEach.call(document.querySelectorAll('[data-contact]'), function (el) {
          el.addEventListener('click', function (e) {
            e.preventDefault();
            window.location.href = 'mailto:' + addr;
          });
        });
      })();
    </script>
  </body>
