<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Pinto | Portfolio</title>
    <meta name="description" content="Full-screen interactive hero landing page for creative agency Mainframe featuring mouse-scrubbed cinematic video background and an infinite-loop depth wheel menu." />
    <meta property="og:title" content="Lucas Pinto | Portfolio" />
    <meta property="og:description" content="Full-screen interactive hero landing page for creative agency Mainframe featuring mouse-scrubbed cinematic video background and an infinite-loop depth wheel menu." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Theme: apply the stored preference before the first paint so the
         page never flashes the default (dark) artwork. Dark ships as the
         static data-theme="dark" on <html> — no JS needed for the default. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('portfolio-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {
        /* private mode / storage disabled: stay on the dark default */
      }
    </script>
    <!-- Loading veil: inline critical CSS — no fetch, so the very first
         paint is always the opaque veil even if Firefox forces layout
         before the other stylesheets load (bug 1404468). -->
    <style>
      /* Full-screen loading veil. js/lib/loader.js adds .is-done once the
         critical resources are ready; the transition layer toggles the
         same veil around same-origin navigations.
         html/body background: any paint that happens between the first
         bytes of <body> and the veil div being parsed comes out dark
         instead of the default white canvas. */
      html,
      body {
        background: #030a14;
      }

      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030a14;
        opacity: 1;
        transition: opacity 0.45s ease, visibility 0s linear 0s;
      }

      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        /* Keep covering (and blocking) until the fade finishes. */
        transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      }

      /* Indeterminate spinner: thin cyan ring with the site's glow recipe. */
      .loader-spinner {
        width: 46px;
        height: 46px;
        border: 3px solid rgba(120, 240, 255, 0.16);
        border-top-color: #7ef0ff;
        border-radius: 50%;
        box-shadow:
          0 0 14px rgba(80, 215, 255, 0.55),
          inset 0 0 10px rgba(80, 215, 255, 0.14);
        animation: loader-spin 0.8s linear infinite;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader,
        #page-loader.is-done {
          transition: none;
        }

        .loader-spinner {
          animation: none;
        }
      }
    </style>
    <noscript><style>#page-loader { display: none; }</style></noscript>
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" type="text/css" />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" type="text/css" />
    <link rel="stylesheet" href="/css/vendor/tailwind.css" />
    <link rel="stylesheet" href="/css/pages/about/base.css" />
    <link rel="stylesheet" href="/css/base/hud.css" />
    <link rel="stylesheet" href="/css/pages/about/nav.css" />
    <link rel="stylesheet" href="/css/pages/about/wheel.css" />
    <link rel="stylesheet" href="/css/pages/about/layers.css" />
    <link rel="stylesheet" href="/css/pages/about/panel.css" />
  </head>
  <body>
    <!-- Loading veil: paints on the first frame, hidden by js/lib/loader.js -->
    <div id="page-loader" role="status" aria-label="Cargando" data-i18n-aria="loading">
      <span class="loader-spinner" aria-hidden="true"></span>
    </div>

    <div class="relative min-h-screen w-full bg-black text-white select-none overflow-hidden">
      <!-- BACKGROUND VIDEO (mouse-scrub controlled) -->
      <video
        id="scrub-video"
        muted
        playsinline
        preload="auto"
        class="pointer-events-none fixed inset-0 z-0 h-full w-full object-cover [object-position:70%_center]"
      >
        <source src="/assets/aistudio/face-aboutMe_030dc440.mp4" type="video/mp4" />
      </video>

      <!-- OVERLAY IMAGE (right half only, above the video, below the UI).
           pointer-events:none + window-level scrub listeners => the mouse-scrub
           animation keeps working exactly as before. object-position:left keeps
           the transparent edge + window frame on screen center and never covers
           the person (who sits in the left half of the video).
           data-theme-src-*: js/lib/theme.js points the src at the artwork
           matching data-theme (night by default, day under [data-theme=light]). -->
      <img
        id="about-overlay"
        src="/about-bg-night.jpg"
        data-theme-src-dark="/about-bg-night.jpg"
        data-theme-src-light="/about-bg-day.jpg"
        alt=""
        aria-hidden="true"
        class="pointer-events-none"
      />

      <!-- TOP SCRIM: the navbar's white "Contactar" lands on the overlay's
           bright cyan frame strip; this gradient restores WCAG contrast
           (measured 1.03:1 before it) without hiding the artwork. -->
      <div id="top-scrim" aria-hidden="true" class="pointer-events-none"></div>

      <!-- OPTION PANEL (glass, slides in from the right over the artwork) -->
      <aside
        id="option-panel"
        role="dialog"
        aria-modal="false"
        aria-labelledby="option-panel-title"
        aria-hidden="true"
        inert
      >
        <button type="button" id="option-panel-close" aria-label="Cerrar panel" data-i18n-aria="closePanel">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M2 2 L14 14 M14 2 L2 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
        <div id="option-panel-body">
          <h2 id="option-panel-title"></h2>
          <p id="option-panel-text"></p>
          <div id="option-panel-actions">
            <a id="option-panel-mail" href="#" data-i18n="sendMail">Enviar mail</a>
            <a id="option-panel-linkedin" href="https://www.linkedin.com/in/pinto-lucas-nahuel/" target="_blank" rel="noopener noreferrer" data-i18n="goLinkedIn">Ir a LinkedIn</a>
          </div>
        </div>
      </aside>

      <!-- NAVBAR (fixed, z-index: 10) — keeps only the mobile hamburger;
           the back arrow now lives in the corner HUD's core. -->
      <nav class="fixed top-0 left-0 right-0 z-10 w-full px-5 sm:px-8 py-4 sm:py-5 flex flex-row justify-between items-center bg-transparent">
        <!-- Mobile hamburger (visible below md) -->
        <button
          type="button"
          id="menu-toggle"
          aria-label="Abrir menú"
          class="md:hidden flex flex-col justify-center items-center w-8 h-8 gap-[5px] focus:outline-none cursor-pointer z-20"
        >
          <span
            id="burger-1"
            class="w-6 h-[2px] bg-white transition-all duration-300 origin-center rotate-0 translate-y-0"
          ></span>
          <span
            id="burger-2"
            class="w-6 h-[2px] bg-white transition-all duration-300 opacity-100"
          ></span>
          <span
            id="burger-3"
            class="w-6 h-[2px] bg-white transition-all duration-300 origin-center rotate-0 translate-y-0"
          ></span>
        </button>
      </nav>

      <!-- CORNER HUD: same concentric wedge as intro.html, but the core
           holds a back arrow to the intro instead of the brand. The ES/EN
           and dark/light switches ride the ring. -->
      <div class="corner-hud">
        <svg class="corner-hud__shape" viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <!-- Diagonal sheen, same trick the artwork's holograms use -->
            <linearGradient id="hud-sheen" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#78f0ff" stop-opacity="0.2" />
              <stop offset="0.55" stop-color="#78f0ff" stop-opacity="0.05" />
              <stop offset="1" stop-color="#78f0ff" stop-opacity="0" />
            </linearGradient>
          </defs>
          <!-- Outer ring: quarter disc minus the inner quarter (evenodd) -->
          <path
            class="corner-hud__ring"
            fill-rule="evenodd"
            d="M0 0 H260 A260 260 0 0 1 0 260 Z M0 0 H150 A150 150 0 0 1 0 150 Z"
          />
          <!-- Inner concentric disc (clipped to the corner by the viewBox) -->
          <circle class="corner-hud__core" cx="0" cy="0" r="150" />
          <!-- Sheen over the whole wedge, on top of both fills -->
          <path class="corner-hud__sheen" d="M0 0 H260 A260 260 0 0 1 0 260 Z" />
        </svg>

        <a class="corner-hud__brand corner-hud__back" href="/intro.html" aria-label="Volver a la intro" data-i18n-aria="backIntro">
          <svg viewBox="0 0 10 18" fill="none" aria-hidden="true">
            <path d="M9 1 L1 9 L9 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </a>

        <div class="corner-hud__controls">
          <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-aria="language">
            <button type="button" data-lang="es" aria-pressed="true">ES</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <!-- Dark/light switch: icon shows the mode the click switches to
               (sun while dark, moon while light), matching the aria-label;
               js/lib/theme.js owns the label, persistence and artwork swap. -->
          <button type="button" class="theme-switch" aria-label="Cambiar a modo claro">
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
        </div>
      </div><!-- /.corner-hud -->

      <!-- MOBILE OVERLAY (z-index: 9) -->
      <div
        id="mobile-menu"
        class="fixed inset-0 z-[9] bg-black/90 backdrop-blur-md flex flex-col justify-center px-8 gap-8 transition-opacity duration-300 md:hidden opacity-0 pointer-events-none"
      >
        <a
          href="about.html"
          data-i18n="about"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Sobre mí
        </a>
        <a
          href="#"
          data-i18n="projects"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Proyectos
        </a>
        <a
          href="#"
          data-contact
          data-i18n="contact"
          rel="nofollow noopener"
          class="mobile-link text-[32px] font-medium text-white underline underline-offset-2 hover:opacity-60 transition-opacity"
        >
          Contactar
        </a>
      </div>

      <!-- HERO SECTION (z-index: 1) -->
      <main class="relative z-[1] h-screen w-full flex flex-col justify-end pb-12 md:justify-center md:pb-0 px-5 sm:px-8 md:px-10 lg:px-16 overflow-hidden items-end">
        <div class="wheel-wrap max-w-xl w-full relative z-10 flex flex-col">
          <!-- Minimalist scroll hints (clickable) -->
          <button type="button" class="wheel-hint wheel-hint--up" aria-label="Sección anterior" data-i18n-aria="prevSection">
            <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M1 9 L9 1 L17 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <!-- DEPTH WHEEL MENU (3 slots, only the center item is selectable) -->
          <nav
            id="wheel"
            class="relative w-full overflow-hidden"
            aria-label="Menú de secciones"
            data-i18n-aria="sectionsMenu"
            tabindex="0"
          >
            <a class="wheel-item" data-slot="0" href="#experiencia" data-i18n="experience">Experiencia</a>
            <a class="wheel-item" data-slot="1" href="#resueltos" data-i18n="achievements" inert aria-hidden="true" tabindex="-1">Logros</a>
            <a class="wheel-item" data-slot="2" href="#herramientas" data-i18n="tools" inert aria-hidden="true" tabindex="-1">Herramientas</a>
            <a class="wheel-item" data-slot="-1" href="#proyectos" data-i18n="myProjects" inert aria-hidden="true" tabindex="-1">Mis Proyectos</a>
            <a class="wheel-item" data-slot="-2" href="#contacto" data-i18n="contact">Contactar</a>
          </nav>
          <button type="button" class="wheel-hint wheel-hint--down" aria-label="Sección siguiente" data-i18n-aria="nextSection">
            <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
              <path d="M1 1 L9 9 L17 1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
      </main>

    </div>

    <script type="module" src="/js/pages/about/index.js"></script>
  </body>
</html>
