<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Pinto | Proyectos</title>
    <meta name="description" content="Proyectos del portfolio de Lucas Pinto: QA Flow Checklists, Jira Traceability Manager y Harness Manager." />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" type="text/css" />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" type="text/css" />
    <style>
      :root {
        --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --bg: #04060f;
        --panel: rgba(10, 40, 80, 0.55);
        --panel-border: rgba(120, 220, 255, 0.35);
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.72);
        --accent: #facc15;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        min-height: 100vh;
        overflow-x: hidden;
      }
      main { display: block; }

      /* ============ CAROUSEL (100vh) ============ */
      #proyectos-carousel {
        position: relative;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
      }
      .slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 96px 24px 80px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 420ms ease, visibility 0s linear 420ms;
        pointer-events: none;
      }
      .slide.is-active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 420ms ease, visibility 0s linear 0s;
      }
      /* ============ SLIDE VIDEO (mouse-scrub controlled) ============ */
      .slide-media {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        /* Yellow field: matches the hero video's baked-in background
           (sampled #FCC714), so the pre-load frame blends seamlessly. */
        background: #fcc714;
      }
      .slide-media video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      /* Dots sit on the yellow band on this slide: flip them to dark ink. */
      #proyectos-carousel:has(.slide[data-slug="qa-flow-checklists"].is-active) .car-dot {
        background: rgba(4, 6, 15, 0.35);
      }
      #proyectos-carousel:has(.slide[data-slug="qa-flow-checklists"].is-active) .car-dot.is-active {
        background: #04060f;
      }
      /* Arrows: translucent navy turns olive on yellow — go solid ink here. */
      #proyectos-carousel:has(.slide[data-slug="qa-flow-checklists"].is-active) .car-arrow {
        background: #04060f;
        border-color: rgba(4, 6, 15, 0.6);
      }
      #proyectos-carousel:has(.slide[data-slug="qa-flow-checklists"].is-active) .car-arrow:hover,
      #proyectos-carousel:has(.slide[data-slug="qa-flow-checklists"].is-active) .car-arrow:focus-visible {
        background: rgba(4, 6, 15, 0.82);
        border-color: rgba(4, 6, 15, 0.9);
      }
      .slide-inner {
        position: relative;
        z-index: 1;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      /* Video slides carry their own visual: drop the duplicate SVG icon. */
      .slide:has(.slide-media) .slide-icon { display: none; }
      /* Alpha video: no scrim, so the text flips from light to dark ink to
         stay legible on the yellow field and on the light clipboard. */
      .slide:has(.slide-media) .slide-title { color: #04060f; }
      .slide:has(.slide-media) .slide-tagline { color: rgba(4, 6, 15, 0.85); }
      .slide-icon {
        width: clamp(90px, 16vw, 150px);
        height: auto;
        stroke: var(--accent, #facc15);
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.95;
        filter: drop-shadow(0 0 18px rgba(120, 220, 255, 0.35));
      }
      .slide-title {
        margin: 0;
        font-family: var(--font-heading);
        font-size: clamp(38px, 7.5vw, 84px);
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--accent, #facc15);
      }
      .slide-tagline {
        margin: 0;
        font-size: clamp(16px, 2vw, 22px);
        color: var(--muted);
        max-width: 56ch;
      }
      .car-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid rgba(120, 220, 255, 0.35);
        background: rgba(10, 40, 80, 0.55);
        backdrop-filter: blur(10px);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 5;
        transition: background 0.2s ease, border-color 0.2s ease;
      }
      .car-arrow:hover, .car-arrow:focus-visible { background: rgba(20, 60, 110, 0.7); border-color: rgba(160, 235, 255, 0.8); outline: none; }
      .car-arrow--prev { left: 20px; }
      .car-arrow--next { right: 20px; }
      .car-arrow svg { width: 22px; height: 22px; }
      .car-dots {
        position: absolute;
        bottom: 26px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 5;
      }
      .car-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        border: 0;
        padding: 0;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        transition: all 300ms ease;
      }
      .car-dot.is-active { width: 28px; background: #fff; }

      /* ============ INFO (scroll below carousel) ============ */
      #proyectos-info {
        position: relative;
        padding: 96px clamp(24px, 8vw, 96px) 140px;
        background: var(--bg);
      }
      #proyectos-info .info-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 40px;
      }
      .chip {
        font-family: var(--font-heading);
        font-size: 15px;
        color: var(--text);
        background: rgba(10, 40, 80, 0.55);
        border: 1px solid rgba(120, 220, 255, 0.35);
        border-radius: 999px;
        padding: 10px 20px;
        cursor: pointer;
        transition: all 200ms ease;
      }
      .chip:hover, .chip:focus-visible { border-color: rgba(160, 235, 255, 0.8); outline: none; }
      .chip.is-active { background: rgba(20, 60, 110, 0.7); border-color: rgba(160, 235, 255, 0.8); }
      #proyectos-info h1 {
        margin: 0 0 8px;
        font-family: var(--font-heading);
        font-size: clamp(34px, 5.5vw, 64px);
        line-height: 1.1;
        color: var(--accent, #facc15);
      }
      #proyectos-info .info-tagline { margin: 0 0 48px; font-size: clamp(16px, 2vw, 20px); color: var(--muted); }
      .info-block { max-width: 760px; margin-bottom: 56px; }
      .info-block h3 {
        margin: 0 0 10px;
        font-family: var(--font-heading);
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent, #facc15);
      }
      .info-block p { margin: 0; font-size: clamp(16px, 1.6vw, 18px); line-height: 1.65; color: var(--text); }
      .info-metric {
        margin-top: 40px;
        display: inline-flex;
        flex-direction: column;
        gap: 4px;
        padding: 20px 28px;
        border: 1px solid rgba(120, 220, 255, 0.35);
        border-radius: 14px;
        background: var(--panel);
        backdrop-filter: blur(10px);
      }
      .info-metric .metric-value { font-family: var(--font-heading); font-size: clamp(28px, 4vw, 44px); color: var(--accent, #facc15); }
      .info-metric .metric-label { font-size: 14px; color: var(--muted); }

      @media (max-width: 767px) {
        .slide { padding: 120px 20px 90px; }
        .car-arrow { width: 48px; height: 48px; top: auto; bottom: 90px; transform: none; }
        .car-arrow--prev { left: 14px; }
        .car-arrow--next { right: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .slide { transition: none; }
        .car-dot { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="proyectos-carousel" aria-label="Proyectos">
        <div class="slide is-active" data-slug="qa-flow-checklists">
          <div class="slide-media" aria-hidden="true">
            <video id="slide-scrub-video" muted playsinline preload="auto">
              <!-- Full-bleed hero: the yellow background is baked into the video. -->
              <source src="/assets/aistudio/QA-checklist-hero.mp4" type="video/mp4" />
            </video>
          </div>
          <div class="slide-inner">
            <svg class="slide-icon" viewBox="0 0 100 100" aria-hidden="true">
              <rect x="32" y="24" width="36" height="52" rx="4" />
              <path d="M44 24v-6h12v6" />
              <path d="M38 44h24M38 52h16" />
              <circle cx="42" cy="68" r="6" />
              <path d="M42 71l4 4 8-8" />
            </svg>
            <h2 class="slide-title" style="--accent: #facc15;">QA Flow Checklists</h2>
            <p class="slide-tagline">221 decisiones de QA, de shift-left a regression.</p>
          </div>
        </div>
        <div class="slide" data-slug="jira-traceability">
          <div class="slide-inner">
            <svg class="slide-icon" viewBox="0 0 100 100" aria-hidden="true">
              <rect x="18" y="28" width="20" height="40" rx="2" />
              <rect x="30" y="28" width="20" height="40" rx="2" />
              <rect x="42" y="28" width="20" height="40" rx="2" />
              <path d="M28 22h8M58 22h8" />
            </svg>
            <h2 class="slide-title" style="--accent: #2bff88;">Jira Traceability Manager</h2>
            <p class="slide-tagline">De 2-3 horas de auditoría manual a 30 segundos.</p>
          </div>
        </div>
        <div class="slide" data-slug="harness-manager">
          <div class="slide-inner">
            <svg class="slide-icon" viewBox="0 0 100 100" aria-hidden="true">
              <path d="M18 30 L6 50 L18 70" />
              <path d="M82 30 L94 50 L82 70" />
              <path d="M50 22v56" />
            </svg>
            <h2 class="slide-title" style="--accent: #ff3355;">Harness Manager</h2>
            <p class="slide-tagline">Cualquier arnés, desde el navegador.</p>
          </div>
        </div>
        <button class="car-arrow car-arrow--prev" id="car-prev" aria-label="Proyecto anterior">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true"><path d="M1 1 L9 5 L17 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="car-arrow car-arrow--next" id="car-next" aria-label="Proyecto siguiente">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true"><path d="M1 9 L9 5 L17 1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <div class="car-dots" id="car-dots" role="tablist" aria-label="Proyectos"></div>
      </section>

      <section id="proyectos-info">
        <div class="info-chips" id="info-chips"></div>
        <div id="info-content"></div>
      </section>
    </main>

    <script>
      (function () {
        var PROJECTS = [
          {
            slug: 'qa-flow-checklists',
            title: 'QA Flow Checklists',
            accent: '#facc15',
            tagline: '221 decisiones de QA, de shift-left a regression.',
            icon: 'clipboard',
            idea:
              'La idea nació cuando el flujo de QA empezó a crecer más rápido que la forma de documentarlo: cada fase del sprint improvisaba su rutina. Convertí eso en cinco checklists navegables, autocontenidos, que convierten cada fase en preguntas concretas que cualquier QA puede seguir sin contexto previo.',
            problems:
              'El refinamiento dependía de la memoria de quien estaba de guardia; el testing variaba según la carga del día; la regression terminaba siendo un smoke a última hora. Sin punto único de verdad, la calidad dependía de quién hacía el trabajo, no del proceso.',
            metric: { value: '221', label: 'items en 5 checklists' },
          },
          {
            slug: 'jira-traceability',
            title: 'Jira Traceability Manager',
            accent: '#2bff88',
            tagline: 'De 2-3 horas de auditoría manual a 30 segundos.',
            icon: 'kanban',
            idea:
              'La idea: auditar la trazabilidad entre historias, tests y releases a mano era un examen manual de horas que solo se hacía en la semana del release. Automatice esa auditoría con un dashboard de 5 vistas sobre un pipeline de una sola orden.',
            problems:
              'Los huecos entre Story, ATP, ATR y TC se descubrían recién en la semana del release; la auditoría manual tomaba 2-3 horas por sprint.',
            metric: { value: '2-3h → 30s', label: 'auditoria de trazabilidad por sprint' },
          },
          {
            slug: 'harness-manager',
            title: 'Harness Manager',
            accent: '#ff3355',
            tagline: 'Cualquier arnés, desde el navegador.',
            icon: 'code',
            idea:
              'Gestionar un arnés de agentes significaba editar archivos a mano: MCPs que nadie apagaba, modelos heredados por costumbre y scripts que solo el autor sabía correr. Construi un dashboard online que lee el arnés por un canal cifrado y administra cada accion con diff, confirmacion y escritura atomica.',
            problems:
              'Los MCPs quedaban sin control, los modelos se heredaban por costumbre y los scripts eran opacos: sin panorama de lo instalado, la operacion del arnés dependia del autor.',
            metric: { value: '6 tabs', label: 'para cualquier arnés de agentes' },
          },
        ];

        var carousel = document.getElementById('proyectos-carousel');
        var slides = Array.prototype.slice.call(carousel.querySelectorAll('.slide'));
        var infoContent = document.getElementById('info-content');
        var chipsWrap = document.getElementById('info-chips');
        var dotsWrap = document.getElementById('car-dots');
        var current = 0;

        function slugToIndex(slug) {
          for (var i = 0; i < PROJECTS.length; i++) {
            if (PROJECTS[i].slug === slug) return i;
          }
          return 0;
        }

        function render() {
          var p = PROJECTS[current];
          for (var i = 0; i < slides.length; i++) {
            slides[i].classList.toggle('is-active', i === current);
          }
          // Info
          infoContent.innerHTML =
            '<h1 style="color:' + p.accent + ';">' + p.title + '</h1>' +
            '<p class="info-tagline">' + p.tagline + '</p>' +
            '<div class="info-block">' +
              '<h3>Cómo surgió la idea</h3><p>' + p.idea + '</p>' +
            '</div>' +
            '<div class="info-block">' +
              '<h3>Qué problemas resuelve</h3><p>' + p.problems + '</p>' +
            '</div>' +
            '<div class="info-metric"><span class="metric-value">' + p.metric.value + '</span><span class="metric-label">' + p.metric.label + '</span></div>';
          // Chips
          chipsWrap.innerHTML = '';
          PROJECTS.forEach(function (p2, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'chip' + (i === current ? ' is-active' : '');
            b.textContent = p2.title;
            b.addEventListener('click', function () { goTo(i); });
            chipsWrap.appendChild(b);
          });
        }

        function goTo(i) {
          current = (i + PROJECTS.length) % PROJECTS.length;
          render();
          var hash = '#' + PROJECTS[current].slug;
          if (window.location.hash !== hash) {
            history.replaceState(null, '', hash);
          }
        }

        // Arrows
        document.getElementById('car-prev').addEventListener('click', function () { goTo(current - 1); });
        document.getElementById('car-next').addEventListener('click', function () { goTo(current + 1); });

        // Dots
        dotsWrap.innerHTML = '';
        PROJECTS.forEach(function (p2, i) {
          var d = document.createElement('button');
          d.type = 'button';
          d.className = 'car-dot' + (i === current ? ' is-active' : '');
          d.setAttribute('aria-label', 'Ir a ' + p2.title);
          d.addEventListener('click', function () { goTo(i); });
          dotsWrap.appendChild(d);
        });

        // Keyboard
        document.addEventListener('keydown', function (e) {
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          if (e.key === 'ArrowRight') { e.preventDefault(); goTo(current + 1); }
          else if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(current - 1); }
        });

        // Hash
        window.addEventListener('hashchange', function () {
          goTo(slugToIndex(window.location.hash.replace('#', '')));
        });

        // Init from hash
        var initSlug = window.location.hash.replace('#', '');
        current = slugToIndex(initSlug);
        render();
        // dots active state
        Array.prototype.forEach.call(dotsWrap.children, function (d, i) {
          d.classList.toggle('is-active', i === current);
        });

        // Swipe
        var touchStartY = null;
        var touchStartX = null;
        carousel.addEventListener('touchstart', function (e) {
          touchStartY = e.touches[0].clientY;
          touchStartX = e.touches[0].clientX;
        }, { passive: true });
        carousel.addEventListener('touchmove', function (e) {
          if (touchStartY === null) return;
          e.preventDefault();
          var dy = touchStartY - e.touches[0].clientY;
          if (Math.abs(dy) > 50) { goTo(current + (dy > 0 ? 1 : -1)); touchStartY = null; }
        }, { passive: false });
        carousel.addEventListener('touchend', function () { touchStartY = null; });

        // ---- QA slide video: mouse-scrub controller (same effect as about.html) ----
        var scrubVideo = document.getElementById('slide-scrub-video');
        var scrubTargetTime = 0;
        var scrubSeeking = false;
        var scrubPrevX = null;
        var SCRUB_SENSITIVITY = 0.8;

        function qaSlideActive() {
          return slides[0] && slides[0].classList.contains('is-active');
        }

        function scrubTo(clientX) {
          if (!scrubVideo || !qaSlideActive()) {
            scrubPrevX = clientX;
            return;
          }
          if (!scrubVideo.duration || Number.isNaN(scrubVideo.duration)) {
            scrubPrevX = clientX;
            return;
          }
          if (scrubPrevX === null) {
            scrubPrevX = clientX;
            return;
          }
          var delta = clientX - scrubPrevX;
          scrubPrevX = clientX;
          var timeOffset = (delta / window.innerWidth) * SCRUB_SENSITIVITY * scrubVideo.duration;
          var newTarget = Math.max(0, Math.min(scrubVideo.duration, scrubTargetTime + timeOffset));
          scrubTargetTime = newTarget;
          if (!scrubSeeking) {
            scrubSeeking = true;
            scrubVideo.currentTime = newTarget;
          }
        }

        window.addEventListener('mousemove', function (e) { scrubTo(e.clientX); });
        window.addEventListener('mouseleave', function () { scrubPrevX = null; });
        window.addEventListener('touchmove', function (e) {
          var t = e.touches[0];
          if (t) scrubTo(t.clientX);
        }, { passive: true });
        window.addEventListener('touchend', function () { scrubPrevX = null; });

        scrubVideo.addEventListener('seeked', function () {
          if (Math.abs(scrubVideo.currentTime - scrubTargetTime) > 0.02) {
            scrubVideo.currentTime = scrubTargetTime;
          } else {
            scrubSeeking = false;
          }
        });

        scrubVideo.addEventListener('loadedmetadata', function () {
          scrubTargetTime = scrubVideo.currentTime || 0;
        });
      })();
    </script>
  </body>
</html>
