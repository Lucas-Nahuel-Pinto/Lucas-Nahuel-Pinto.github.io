<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Pinto | Proyectos</title>
    <meta name="description" content="Proyectos del portfolio de Lucas Pinto: QA Flow Checker, Jira Trace Mapper y Agents Manager." />
    <!-- Theme: apply the stored preference before the first paint so the
         page never flashes the default (dark) artwork. Dark ships as the
         static data-theme="dark" on <html> — no JS needed for the default. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('portfolio-theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {
        /* private mode / storage disabled: stay on the dark default */
      }
    </script>
    <!-- Loading veil: inline critical CSS — no fetch, so the very first
         paint is always the opaque veil even if Firefox forces layout
         before the other stylesheets load (bug 1404468). -->
    <style>
      /* Full-screen loading veil. js/lib/loader.js adds .is-done once the
         critical resources are ready; the transition layer toggles the
         same veil around same-origin navigations.
         html/body background: any paint that happens between the first
         bytes of <body> and the veil div being parsed comes out dark
         instead of the default white canvas. */
      html,
      body {
        background: #030a14;
      }

      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030a14;
        opacity: 1;
        transition: opacity 0.45s ease, visibility 0s linear 0s;
      }

      #page-loader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        /* Keep covering (and blocking) until the fade finishes. */
        transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      }

      /* Indeterminate spinner: thin cyan ring with the site's glow recipe. */
      .loader-spinner {
        width: 46px;
        height: 46px;
        border: 3px solid rgba(120, 240, 255, 0.16);
        border-top-color: #7ef0ff;
        border-radius: 50%;
        box-shadow:
          0 0 14px rgba(80, 215, 255, 0.55),
          inset 0 0 10px rgba(80, 215, 255, 0.14);
        animation: loader-spin 0.8s linear infinite;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader,
        #page-loader.is-done {
          transition: none;
        }

        .loader-spinner {
          animation: none;
        }
      }
    </style>
    <noscript><style>#page-loader { display: none; }</style></noscript>
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/5ac3fe7c6abd2f62067f266d89671492?family=HelveticaNowDisplay-Medium" type="text/css" />
    <link rel="stylesheet" href="https://db.onlinewebfonts.com/c/1aa3377e489837a26d019bba501e779d?family=HelveticaNowDisplayW01-Rg" type="text/css" />
    <link rel="stylesheet" href="/css/base/reset.css" />
    <link rel="stylesheet" href="/css/base/hud.css" />
    <link rel="stylesheet" href="/css/pages/proyectos/tokens.css" />
    <link rel="stylesheet" href="/css/pages/proyectos/carousel.css" />
    <link rel="stylesheet" href="/css/pages/proyectos/info.css" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Lucas-Pinto" />
    <meta name="theme-color" content="#040e4f" />
  </head>
  <body>
    <!-- Loading veil: paints on the first frame, hidden by js/lib/loader.js -->
    <div id="page-loader" role="status" aria-label="Cargando" data-i18n-aria="loading">
      <span class="loader-spinner" aria-hidden="true"></span>
    </div>

    <!-- CORNER HUD: same concentric wedge as intro/about; the core is a
         back arrow to the main menu and the whole disc is clickable.
         The band splits into three equal 30° sector buttons (theme, EN,
         ES from the top edge down) — js/lib/i18n.js + js/lib/theme.js
         run from js/pages/proyectos/index.js. -->
    <div class="corner-hud">
      <svg class="corner-hud__shape" viewBox="0 0 260 260" aria-hidden="true">
        <defs>
          <!-- Diagonal sheen, same trick the artwork's holograms use -->
          <linearGradient id="hud-sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#78f0ff" stop-opacity="0.2" />
            <stop offset="0.55" stop-color="#78f0ff" stop-opacity="0.05" />
            <stop offset="1" stop-color="#78f0ff" stop-opacity="0" />
          </linearGradient>
          <!-- Active-sector gradient: the old lang chip's cyan fill -->
          <linearGradient id="hud-sector-active" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#00beff" stop-opacity="0.6" />
            <stop offset="1" stop-color="#005abe" stop-opacity="0.7" />
          </linearGradient>
        </defs>
        <!-- Outer ring: quarter disc minus the inner quarter (evenodd) -->
        <path
          class="corner-hud__ring"
          fill-rule="evenodd"
          d="M0 0 H260 A260 260 0 0 1 0 260 Z M0 0 H150 A150 150 0 0 1 0 150 Z"
        />
        <!-- Inner concentric disc (clipped to the corner by the viewBox) -->
        <circle class="corner-hud__core" cx="0" cy="0" r="150" />
        <!-- Ring band split into three 30° sectors (theme 0–30°, EN
             30–60°, ES 60–90° from the top edge) + the dividers that
             mark their seams; hover/active fills live in hud.css -->
        <path class="corner-hud__sector corner-hud__sector--theme" d="M150 0 L260 0 A260 260 0 0 1 225.17 130 L129.9 75 A150 150 0 0 0 150 0 Z" />
        <path class="corner-hud__sector corner-hud__sector--en" d="M129.9 75 L225.17 130 A260 260 0 0 1 130 225.17 L75 129.9 A150 150 0 0 0 129.9 75 Z" />
        <path class="corner-hud__sector corner-hud__sector--es" d="M75 129.9 L130 225.17 A260 260 0 0 1 0 260 L0 150 A150 150 0 0 0 75 129.9 Z" />
        <line class="corner-hud__divider" x1="129.9" y1="75" x2="225.17" y2="130" />
        <line class="corner-hud__divider" x1="75" y1="129.9" x2="130" y2="225.17" />
        <!-- Sheen over the whole wedge, on top of every fill -->
        <path class="corner-hud__sheen" d="M0 0 H260 A260 260 0 0 1 0 260 Z" />
      </svg>

      <a class="corner-hud__brand corner-hud__back" href="/intro.html" aria-label="Volver a la intro" data-i18n-aria="backIntro">
        <svg viewBox="0 0 10 18" fill="none" aria-hidden="true">
          <path d="M9 1 L1 9 L9 17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>

      <!-- Three equal 30° sector buttons over the ring band: each
           language owns its slice (aria-pressed marks the live one) and
           the theme toggle owns the top slice — its icon shows the mode
           the click switches to (sun while dark, moon while light),
           matching the aria-label; js/lib/i18n.js + js/lib/theme.js own
           state, label, persistence and artwork swap. -->
      <button type="button" class="hud-sector hud-sector--es" data-lang="es" aria-pressed="true">
        <span class="hud-sector__label">ES</span>
      </button>
      <button type="button" class="hud-sector hud-sector--en" data-lang="en" aria-pressed="false">
        <span class="hud-sector__label">EN</span>
      </button>
      <button type="button" class="hud-sector hud-sector--theme theme-switch" aria-label="Cambiar a modo claro">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      </button>
    </div><!-- /.corner-hud -->

    <main>
      <section id="proyectos-carousel" aria-label="Proyectos" data-i18n-aria="projects">
        <div class="slide is-active" data-slug="qa-flow-checker">
          <div class="slide-media" aria-hidden="true">
            <video id="slide-scrub-video" muted playsinline preload="auto">
              <!-- Full-bleed hero: the yellow background is baked into the video. -->
              <source src="/assets/aistudio/QA-checklist-hero.mp4" type="video/mp4" />
            </video>
          </div>
          <h2 class="slide-title">QA Flow Checker</h2>
        </div>
        <div class="slide" data-slug="jira-trace-mapper">
          <div class="slide-media" aria-hidden="true">
            <video id="jtm-scrub-video" muted playsinline preload="auto">
              <!-- Full-bleed hero: the green screen is baked into the video. -->
              <source src="/assets/aistudio/jtm-hero.mp4" type="video/mp4" />
            </video>
          </div>
          <h2 class="slide-title">Jira Trace Mapper</h2>
        </div>
        <div class="slide" data-slug="agents-manager">
          <div class="slide-media" aria-hidden="true">
            <video id="harness-scrub-video" muted playsinline preload="auto">
              <!-- Full-bleed hero: the red background is baked into the video. -->
              <source src="/assets/aistudio/harness-manager-hero.mp4" type="video/mp4" />
            </video>
          </div>
          <h2 class="slide-title">Agents Manager</h2>
        </div>
        <button class="car-arrow car-arrow--prev" id="car-prev" aria-label="Proyecto anterior" data-i18n-aria="prevProject">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true"><path d="M1 1 L9 5 L17 9" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="car-arrow car-arrow--next" id="car-next" aria-label="Proyecto siguiente" data-i18n-aria="nextProject">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true"><path d="M1 9 L9 5 L17 1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <div class="car-dots" id="car-dots" role="tablist" aria-label="Proyectos" data-i18n-aria="projects"></div>
        <!-- Scroll hint: one wheel tick (or a tap on the chevron) drops the
             whole page to the detail section below. Same holographic recipe
             as about's wheel hints. -->
        <button type="button" class="car-scroll" id="car-scroll" aria-label="Bajar a los detalles" data-i18n-aria="scrollToDetails">
          <svg viewBox="0 0 18 10" fill="none" aria-hidden="true">
            <path d="M1 1 L9 9 L17 1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </section>

      <section id="proyectos-info">
        <div class="info-chips" id="info-chips"></div>
        <div id="info-content"></div>
      </section>
    </main>

    <script type="module" src="/js/pages/proyectos/index.js"></script>
  </body>
</html>
